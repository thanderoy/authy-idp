[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
pythonpath = src .
addopts = -n auto --cov=src --cov-report=term-missing --no-cov-on-fail
filterwarnings =
    ignore:.*urllib3.*
    ignore:.*RequestsDependencyWarning.*
    ignore:No directory at:UserWarning
# pytest-env: evaluate settings production-like everywhere, whatever a local
# .env says. (These lived in a [pytest-env] section, which pytest-env ignores.)
env =
    DEBUG=False
    SECURE_SSL_REDIRECT=False
    OIDC_RSA_PRIVATE_KEY=dummy

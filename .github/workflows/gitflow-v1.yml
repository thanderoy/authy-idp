name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # mypy's Django plugin imports settings; give it a dev-mode config.
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check src tests

      - name: Type check
        run: |
          openssl genrsa -out oidc.key 2048
          uv run mypy src

      - name: Test
        run: uv run pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Audit locked dependencies for known vulnerabilities
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt > requirements.lock
          uvx pip-audit -r requirements.lock --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t authy-oidc-server:ci .
